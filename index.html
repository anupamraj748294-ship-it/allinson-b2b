<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ALLINSON - B2B Wholesale Portal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FFE082'/%3E%3Cstop offset='100%25' stop-color='%23AA7C11'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='%23052619'/%3E%3Ccircle cx='256' cy='256' r='145' stroke='url(%23g)' stroke-width='16' fill='none'/%3E%3Cpath d='M256 150 L325 330 L288 330 L256 242 L224 330 L187 330 Z' fill='url(%23g)'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #071e14;
      --card-bg: #0d2c1f;
      --border: #1a4a35;
      --gold: #f4c430;
      --gold-gradient: linear-gradient(135deg, #ffe082 0%, #d4af37 50%, #aa7c11 100%);
      --text: #ffffff;
      --text-muted: #94a3b8;
      --green: #15803d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Top Bar with Brand Logo */
    header {
      background: rgba(7, 30, 20, 0.98);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-box { display: flex; align-items: center; gap: 10px; }
    .brand-svg-logo { width: 38px; height: 38px; }
    .brand-name { font-size: 20px; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .b2b-pill { background: #14532d; color: #86efac; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid #22c55e; }
    .cart-btn { background: var(--gold); color: #071e14; border: none; padding: 7px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; }

    /* Search & Category Pills */
    .search-wrap { padding: 10px 16px 4px; }
    .search-wrap input { width: 100%; background: var(--card-bg); border: 1px solid var(--border); color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; outline: none; }
    .category-scroll { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border); padding: 7px 12px; border-radius: 18px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .cat-btn.active { background: var(--gold); color: #071e14; border-color: var(--gold); font-weight: 700; }

    /* Demand Banner */
    .demand-box {
      margin: 6px 16px 10px;
      background: linear-gradient(135deg, #103826, #092418);
      border: 1px dashed var(--gold);
      padding: 10px 12px;
      border-radius: 12px;
    }
    .demand-box h4 { font-size: 13px; color: var(--gold); font-weight: 700; margin-bottom: 3px; }
    .demand-box p { font-size: 11px; color: #cbd5e1; margin-bottom: 6px; }
    .demand-row { display: flex; gap: 6px; }
    .demand-row input { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: #071e14; color: #fff; font-size: 12px; outline: none; }
    .demand-row button { background: var(--gold); color: #071e14; border: none; padding: 0 12px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; }

    /* 2-Column Product Grid (Two Patti) */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 6px 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; width: fit-content; }
    .badge-homeo { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .badge-ayur { background: #713f12; color: #fde047; border: 1px solid #ca8a04; }
    .badge-german { background: #1e3a5f; color: #93c5fd; border: 1px solid #3b82f6; }

    .med-name { font-size: 13px; font-weight: 600; color: #ffffff; line-height: 1.3; min-height: 36px; margin-bottom: 4px; }
    .mrp-line { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .mrp-line b { font-size: 13px; color: #ffffff; font-weight: 700; }
    
    .discount-pill {
      background: rgba(22, 101, 52, 0.4);
      color: #86efac;
      border: 1px solid #22c55e;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    /* Quantity Box (+ / -) */
    .qty-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #071e14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      margin-bottom: 8px;
    }
    .qty-btn {
      width: 26px;
      height: 26px;
      background: #14452f;
      border: none;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-number { font-size: 12px; font-weight: 700; color: var(--gold); }
    .qty-unit { font-size: 9px; color: var(--text-muted); margin-left: 2px; }

    .add-btn {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Fixed Bottom Bar */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #051a11;
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 99;
    }
    .footer-info { font-size: 11px; color: #cbd5e1; }
    .footer-info b { color: var(--gold); font-size: 12px; display: block; }
    .call-btn-wrap { display: flex; gap: 6px; }
    .call-btn { background: var(--gold-gradient); color: #071e14; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }

    /* Modal / Bottom Sheet */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: flex-end; }
    .modal-box { background: var(--card-bg); width: 100%; max-width: 500px; padding: 16px; border-radius: 18px 18px 0 0; border: 1px solid var(--border); max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .modal-header h3 { font-size: 16px; color: var(--gold); font-weight: 700; }
    .close-btn { font-size: 18px; color: var(--text-muted); cursor: pointer; }

    .form-item { margin-bottom: 10px; }
    .form-item label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 3px; font-weight: 600; }
    .form-item input, .form-item textarea { width: 100%; background: #071e14; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 12px; outline: none; }
    .pay-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 14px; }
    .pay-card { background: #071e14; border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: 600; text-align: center; cursor: pointer; }
    .pay-card.selected { border-color: var(--gold); background: #103826; color: var(--gold); }
    .checkout-submit { width: 100%; background: #25d366; color: #fff; border: none; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Top App Bar with Gold Logo -->
  <header>
    <div class="brand-box">
      <svg class="brand-svg-logo" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE082"/>
            <stop offset="100%" stop-color="#AA7C11"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="110" fill="#052619"/>
        <circle cx="256" cy="256" r="145" stroke="url(#gGold)" stroke-width="18" fill="none"/>
        <path d="M256 150 L325 330 L288 330 L256 242 L224 330 L187 330 Z" fill="url(#gGold)"/>
        <path d="M220 280 Q256 240 310 270 Q265 315 220 280 Z" fill="#22c55e"/>
      </svg>
      <div>
        <div class="brand-name">ALLINSON</div>
      </div>
      <div class="b2b-pill">B2B</div>
    </div>
    <button class="cart-btn" onclick="openCart()">🛒 कार्ट (<span id="cartCount">0</span>)</button>
  </header>

  <!-- Search -->
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="दवा सर्च करें..." onkeyup="filterItems()">
  </div>

  <!-- Categories with Custom Badges -->
  <div class="category-scroll">
    <button class="cat-btn active" onclick="setFilter('all', this)">⭐ सभी दवाइयाँ</button>
    <button class="cat-btn" onclick="setFilter('Homeopathic', this)">💧 होम्योपैथिक</button>
    <button class="cat-btn" onclick="setFilter('Ayurvedic', this)">🌿 आयुर्वेदिक</button>
    <button class="cat-btn" onclick="setFilter('German', this)">🛡️ जर्मन</button>
  </div>

  <!-- Medicine Demand Banner -->
  <div class="demand-box">
    <h4>📦 दवा नहीं मिल रही? यहाँ डिमांड करें</h4>
    <p>दवा का नाम लिखें, हम थोक रेट पर उपलब्ध कराएँगे:</p>
    <div class="demand-row">
      <input type="text" id="demandInput" placeholder="दवा व कंपनी का नाम...">
      <button onclick="submitDemand()">डिमांड भेजें</button>
    </div>
  </div>

  <!-- 2-Patti Grid View -->
  <div class="catalog-grid" id="catalogGrid"></div>

  <!-- Bottom Call Assistance -->
  <div class="footer-bar">
    <div class="footer-info">
      <b>कॉल करके भी ऑर्डर मंगा सकते हैं</b>
      रेट व ऑर्डर सहायता
    </div>
    <div class="call-btn-wrap">
      <a href="tel:7482948349" class="call-btn">📞 7482948349</a>
      <a href="tel:6207222800" class="call-btn">📞 6207222800</a>
    </div>
  </div>

  <!-- Cart & Checkout Modal -->
  <div class="modal-backdrop" id="cartModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>🛒 आपकी कार्ट एवं चेकआउट</h3>
        <span class="close-btn" onclick="closeCart()">✕</span>
      </div>

      <div id="cartList" style="margin-bottom: 12px; max-height: 160px; overflow-y: auto;"></div>

      <div id="checkoutForm">
        <div class="form-item">
          <label>दुकान / ग्राहक का नाम *</label>
          <input type="text" id="custName" placeholder="अपना या दुकान का नाम लिखें">
        </div>
        <div class="form-item">
          <label>मोबाइल नंबर *</label>
          <input type="tel" id="custPhone" placeholder="संपर्क नंबर">
        </div>
        <div class="form-item">
          <label>पूरा पता व पिनकोड *</label>
          <textarea id="custAddress" rows="2" placeholder="दुकान/घर का पता, शहर, पिनकोड"></textarea>
        </div>

        <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">पेमेंट मोड चुनें *</label>
        <div class="pay-selector">
          <div class="pay-card selected" id="optCOD" onclick="setPayment('Cash on Delivery (COD)')">💵 Cash on Delivery</div>
          <div class="pay-card" id="optOnline" onclick="setPayment('Online UPI / Bank Transfer')">💳 Online / UPI</div>
        </div>

        <button class="checkout-submit" onclick="submitWhatsAppOrder()">WhatsApp पर ऑर्डर भेजें</button>
      </div>
    </div>
  </div>

  <script>
    // दवाइयों की लिस्ट (न्यूनतम 6 पीस डिफॉल्ट)
    let medicines = [
      { id: 1, name: "Arnica Montana 30 / 200", category: "Homeopathic", mrp: 120, minQty: 6, qty: 6 },
      { id: 2, name: "Berberis Aquifolium Q", category: "Homeopathic", mrp: 180, minQty: 6, qty: 6 },
      { id: 3, name: "Dr. Reckeweg R1 to R89", category: "German", mrp: 290, minQty: 5, qty: 5 },
      { id: 4, name: "Schwabe Cineraria Eye Drop", category: "German", mrp: 175, minQty: 5, qty: 5 },
      { id: 5, name: "Ashwagandha Churna 100g", category: "Ayurvedic", mrp: 150, minQty: 6, qty: 6 },
      { id: 6, name: "Chyawanprash Special 1kg", category: "Ayurvedic", mrp: 450, minQty: 5, qty: 5 },
      { id: 7, name: "Adel 48 (Itires Drop)", category: "German", mrp: 310, minQty: 5, qty: 5 },
      { id: 8, name: "Liv-52 Syrup / Tablets", category: "Ayurvedic", mrp: 160, minQty: 6, qty: 6 },
      { id: 9, name: "Thuja Occidentalis 200", category: "Homeopathic", mrp: 135, minQty: 6, qty: 6 },
      { id: 10, name: "Triphala Churna 500g", category: "Ayurvedic", mrp: 210, minQty: 6, qty: 6 }
    ];

    let cart = [];
    let activeCategory = 'all';
    let paymentMode = 'Cash on Delivery (COD)';

    function getDiscount(cat) {
      if (cat === "Homeopathic") return "50% से 75% छूट";
      if (cat === "Ayurvedic") return "25% से 75% छूट";
      if (cat === "German") return "30% से 40% छूट";
      return "होलसेल छूट";
    }

    function getCatBadge(cat) {
      if (cat === "Homeopathic") return `<span class="card-badge badge-homeo">💧 Homeo</span>`;
      if (cat === "Ayurvedic") return `<span class="card-badge badge-ayur">🌿 Ayur</span>`;
      if (cat === "German") return `<span class="card-badge badge-german">🛡️ German</span>`;
      return `<span class="card-badge badge-homeo">💧 Homeo</span>`;
    }

    function renderCatalog() {
      const grid = document.getElementById('catalogGrid');
      const q = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      const items = medicines.filter(m => {
        const catMatch = activeCategory === 'all' || m.category === activeCategory;
        const searchMatch = m.name.toLowerCase().includes(q);
        return catMatch && searchMatch;
      });

      if (items.length === 0) {
        grid.innerHTML = '<div style="grid-column: span 2; text-align:center; padding: 25px; color:#94a3b8; font-size:12px;">कोई दवा नहीं मिली। ऊपर डिमांड भेजें।</div>';
        return;
      }

      items.forEach(med => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            ${getCatBadge(med.category)}
            <div class="med-name">${med.name}</div>
            <div class="mrp-line">MRP: <b>₹${med.mrp}</b></div>
            <div class="discount-pill">🏷️ ${getDiscount(med.category)}</div>
          </div>
          <div>
            <div class="qty-control">
              <button class="qty-btn" onclick="updateQty(${med.id}, -1)">−</button>
              <div><span class="qty-number" id="qty-${med.id}">${med.qty}</span><span class="qty-unit"> पीस</span></div>
              <button class="qty-btn" onclick="updateQty(${med.id}, 1)">+</button>
            </div>
            <button class="add-btn" onclick="addToCart(${med.id})">🛒 कार्ट में जोड़ें</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function updateQty(id, change) {
      const med = medicines.find(m => m.id === id);
      const newQty = med.qty + change;
      if (newQty >= med.minQty) {
        med.qty = newQty;
        document.getElementById(`qty-${id}`).innerText = med.qty;
      } else {
        alert(`न्यूनतम थोक ऑर्डर ${med.minQty} पीस का है!`);
      }
    }

    function addToCart(id) {
      const med = medicines.find(m => m.id === id);
      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty += med.qty;
      } else {
        cart.push({ ...med });
      }
      document.getElementById('cartCount').innerText = cart.length;
      alert(`${med.name} (${med.qty} पीस) कार्ट में जोड़ दिया गया!`);
    }

    function openCart() {
      const list = document.getElementById('cartList');
      if (cart.length === 0) {
        list.innerHTML = "<p style='color:#94a3b8; font-size:12px; padding:10px 0;'>आपकी कार्ट खाली है।</p>";
      } else {
        list.innerHTML = cart.map((it, idx) => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #1a4a35; font-size:12px;">
            <div>
              <b>${it.name}</b><br>
              <span style="color:#94a3b8; font-size:11px;">मात्रा: ${it.qty} पीस | MRP: ₹${it.mrp}</span>
            </div>
            <span style="color:#ef4444; font-weight:700; cursor:pointer;" onclick="removeItem(${idx})">हटाएं</span>
          </div>
        `).join('');
      }
      document.getElementById('cartModal').style.display = 'flex';
    }

    function removeItem(idx) {
      cart.splice(idx, 1);
      document.getElementById('cartCount').innerText = cart.length;
      openCart();
    }

    function closeCart() {
      document.getElementById('cartModal').style.display = 'none';
    }

    function setPayment(mode) {
      paymentMode = mode;
      document.getElementById('optCOD').classList.toggle('selected', mode === 'Cash on Delivery (COD)');
      document.getElementById('optOnline').classList.toggle('selected', mode === 'Online UPI / Bank Transfer');
    }

    function submitWhatsAppOrder() {
      if (cart.length === 0) return alert("ऑर्डर करने के लिए कार्ट में दवा जोड़ें!");
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();

      if (!name || !phone || !address) {
        return alert("कृपया नाम, मोबाइल नंबर और पूरा डिलीवरी पता भरें!");
      }

      let orderMsg = `*नया होलसेल दवा ऑर्डर - ALLINSON*\n`;
      orderMsg += `--------------------------\n`;
      orderMsg += `*ग्राहक/दुकान:* ${name}\n`;
      orderMsg += `*मोबाइल:* ${phone}\n`;
      orderMsg += `*डिलीवरी पता:* ${address}\n`;
      orderMsg += `*पेमेंट मोड:* ${paymentMode}\n\n`;
      orderMsg += `*दवाइयों की सूची:*\n`;

      cart.forEach((item, i) => {
        orderMsg += `${i + 1}. ${item.name} - ${item.qty} पीस (MRP: ₹${item.mrp}) [${getDiscount(item.category)}]\n`;
      });

      orderMsg += `\nकृपया फाइनल डिस्काउंट बिल और डिलीवरी समय साझा करें।`;

      window.open(`https://wa.me/917482948349?text=${encodeURIComponent(orderMsg)}`);
    }

    function submitDemand() {
      const val = document.getElementById('demandInput').value.trim();
      if (!val) return alert("कृपया दवा का नाम लिखें!");
      const msg = `नमस्ते ALLINSON, मुझे यह दवा थोक में चाहिए जो लिस्ट में नहीं है:\n\nदवा का नाम: ${val}\n\nकृपया इसका होलसेल रेट और उपलब्धता बताएं।`;
      window.open(`https://wa.me/917482948349?text=${encodeURIComponent(msg)}`);
    }

    function filterItems() { renderCatalog(); }

    function setFilter(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCatalog();
    }

    renderCatalog();
  </script>
</body>
</html>
