/* ===================== स्टेट ===================== */
const S = {
  user: null, cart: [], view: 'splash', stack: [],
  list: { cat: 'all', q: '', sort: 'def' },
  pid: null, qty: 0, oid: null, ordFilter: 'all', authMode: 'login',
  co: { step: 1, addr: 0, pay: 'COD', note: '', adding: false }, lastOrder: null
};
const cartKey = () => 'aln_cart_' + S.user.mobile;
const ordKey = () => 'aln_orders_' + S.user.mobile;
const orders = () => LS.get(ordKey(), []);

function go(v) { S.stack.push(S.view); S.view = v; render(); }
function back() { S.view = S.stack.pop() || 'home'; render(); }
function tab(v) { S.stack = []; S.view = v; if (v === 'cats') { S.list.cat = 'all'; S.list.q = ''; } render(); }
function saveCart() { LS.set(cartKey(), S.cart); updBadges(); }
function updBadges() {
  const n = S.cart.length;
  document.querySelectorAll('.cbadge').forEach(b => { b.textContent = n; b.style.display = n ? 'flex' : 'none'; });
}
function totals(items) {
  let mrp = 0, sub = 0, count = 0;
  items.forEach(i => { const p = prod(i.id); mrp += p.mrp * i.qty; sub += rate(p) * i.qty; count += i.qty; });
  return { mrp, sub, save: mrp - sub, count };
}

/* ===================== कार्ट ===================== */
function addCart(id, qty) {
  const p = prod(id); qty = Math.max(qty || p.minQty, p.minQty);
  const e = S.cart.find(c => c.id === id);
  if (e) e.qty += qty; else S.cart.push({ id, qty });
  saveCart(); toast(`${p.name} (${qty} पीस) कार्ट में जुड़ गया`);
}
function cartQty(id, d) {
  const it = S.cart.find(c => c.id === id), p = prod(id), n = it.qty + d;
  if (n < p.minQty) {
    if (confirm(`न्यूनतम ऑर्डर ${p.minQty} पीस का है। इसे कार्ट से हटाएँ?`)) S.cart = S.cart.filter(c => c.id !== id);
  } else it.qty = n;
  saveCart(); render();
}
function cartDel(id) { S.cart = S.cart.filter(c => c.id !== id); saveCart(); render(); }
function clearCart() { if (S.cart.length && confirm('पूरी कार्ट खाली करें?')) { S.cart = []; saveCart(); render(); } }
function buyNow() { addCart(S.pid, S.qty); S.stack = ['home']; S.view = 'cart'; render(); }

/* ===================== लॉगिन / रजिस्ट्रेशन ===================== */
function startSession(m) {
  LS.set('aln_session', m);
  S.user = users()[m]; S.cart = LS.get('aln_cart_' + m, []);
  S.stack = []; S.view = 'home'; render();
}
async function doLogin() {
  const m = val('lm'), p = document.getElementById('lp').value;
  if (!/^\d{10}$/.test(m)) return toast('सही 10 अंकों का मोबाइल नंबर डालें');
  const u = users()[m];
  if (!u || u.h !== await hashPw(p)) return toast('मोबाइल नंबर या पासवर्ड गलत है');
  startSession(m);
}
async function doRegister() {
  const name = val('rn'), shop = val('rs'), m = val('rm'), pin = val('rp'), addr = val('ra');
  const p1 = document.getElementById('rp1').value, p2 = document.getElementById('rp2').value;
  if (!name || !shop) return toast('अपना और दुकान का नाम भरें');
  if (!/^\d{10}$/.test(m)) return toast('सही 10 अंकों का मोबाइल नंबर डालें');
  if (!addr || !/^\d{6}$/.test(pin)) return toast('पूरा पता और 6 अंकों का पिनकोड भरें');
  if (p1.length < 6) return toast('पासवर्ड कम से कम 6 अक्षर का रखें');
  if (p1 !== p2) return toast('दोनों पासवर्ड एक जैसे नहीं हैं');
  const all = users();
  if (all[m]) return toast('यह मोबाइल नंबर पहले से रजिस्टर है, लॉगिन करें');
  all[m] = { name, shop, mobile: m, h: await hashPw(p1), addresses: [{ line: addr, pin }], created: Date.now() };
  LS.set('aln_users', all); startSession(m); toast('रजिस्ट्रेशन सफल, स्वागत है!');
}
async function doReset() {
  const m = val('fm'), shop = val('fs'), p = document.getElementById('fp').value;
  const all = users(), u = all[m];
  if (!u || u.shop.toLowerCase() !== shop.toLowerCase()) return toast('मोबाइल नंबर या दुकान का नाम मेल नहीं खाता');
  if (p.length < 6) return toast('नया पासवर्ड कम से कम 6 अक्षर का रखें');
  u.h = await hashPw(p); LS.set('aln_users', all);
  S.authMode = 'login'; render(); toast('पासवर्ड बदल गया, अब लॉगिन करें');
}
function authMode(m) { S.authMode = m; render(); }
function logout() {
  if (!confirm('लॉगआउट करें?')) return;
  LS.del('aln_session'); S.user = null; S.cart = []; S.stack = []; S.authMode = 'login'; S.view = 'auth'; render();
}
function togglePw(id) { const e = document.getElementById(id); e.type = e.type === 'password' ? 'text' : 'password'; }

/* ===================== WhatsApp ===================== */
function wa(msg) {
  const w = window.open(`https://wa.me/${CONFIG.WA}?text=${encodeURIComponent(msg)}`, '_blank');
  if (!w) location.href = `https://wa.me/${CONFIG.WA}?text=${encodeURIComponent(msg)}`;
}
function orderMsg(o) {
  const u = S.user;
  let m = `*नया होलसेल दवा ऑर्डर - ALLINSON*\n*ऑर्डर नं:* ${o.id}\n--------------------------\n`;
  m += `*दुकान:* ${u.shop}\n*नाम:* ${u.name}\n*मोबाइल:* ${u.mobile}\n`;
  m += `*डिलीवरी पता:* ${o.addr.line}, ${o.addr.pin}\n*पेमेंट मोड:* ${o.pay}\n`;
  if (o.note) m += `*निर्देश:* ${o.note}\n`;
  m += `\n*दवाइयों की सूची:*\n`;
  o.items.forEach((it, i) => { m += `${i + 1}. ${it.name} - ${it.qty} पीस (MRP ₹${it.mrp}, अनुमानित रेट ₹${it.rate}) = ₹${it.rate * it.qty}\n`; });
  m += `\n*अनुमानित कुल:* ${rs(o.sub)} (MRP ${rs(o.sub + o.save)})\n`;
  m += `\nकृपया फाइनल डिस्काउंट बिल और डिलीवरी समय साझा करें।`;
  return m;
}
function submitDemand(id) {
  const v = val(id || 'dem');
  if (!v) return toast('दवा का नाम लिखें');
  wa(`नमस्ते ALLINSON, मुझे यह दवा थोक में चाहिए जो लिस्ट में नहीं है:\n\nदवा का नाम: ${v}\n\nकृपया इसका होलसेल रेट और उपलब्धता बताएं।`);
}

/* ===================== चेकआउट ===================== */
function startCheckout() {
  if (!S.cart.length) return toast('कार्ट खाली है');
  S.co = { step: 1, addr: 0, pay: 'COD', note: '', adding: false }; go('checkout');
}
function coStep(n) {
  if (n === 2 && S.co.adding) return toast('पहले नया पता सेव करें या रद्द करें');
  const nt = document.getElementById('cnote'); if (nt) S.co.note = nt.value.trim();
  S.co.step = n; render();
}
function coAddr(i) { S.co.addr = i; render(); }
function coPay(p) { S.co.pay = p; render(); }
function saveAddr(from) {
  const line = val('na'), pin = val('np');
  if (!line || !/^\d{6}$/.test(pin)) return toast('पूरा पता और 6 अंकों का पिनकोड भरें');
  const all = users(); all[S.user.mobile].addresses.push({ line, pin });
  LS.set('aln_users', all); S.user = all[S.user.mobile];
  if (from === 'co') { S.co.addr = S.user.addresses.length - 1; S.co.adding = false; }
  else S.addAddr = false;
  render(); toast('पता सेव हो गया');
}
function delAddr(i) {
  if (S.user.addresses.length <= 1) return toast('कम से कम एक पता रहना ज़रूरी है');
  if (!confirm('यह पता हटाएँ?')) return;
  const all = users(); all[S.user.mobile].addresses.splice(i, 1);
  LS.set('aln_users', all); S.user = all[S.user.mobile]; S.co.addr = 0; render();
}
function placeOrder() {
  const addr = S.user.addresses[S.co.addr]; if (!addr) return toast('डिलीवरी पता चुनें');
  const items = S.cart.map(c => { const p = prod(c.id); return { id: p.id, name: p.name, qty: c.qty, rate: rate(p), mrp: p.mrp }; });
  const t = totals(S.cart), list = orders(), d = new Date();
  const id = 'ALN' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(list.length + 1).padStart(3, '0');
  const o = { id, date: d.toISOString(), items, sub: t.sub, save: t.save, addr, pay: S.co.pay === 'COD' ? 'Cash on Delivery (COD)' : 'Online UPI / Bank Transfer', note: S.co.note, status: 'Processing' };
  list.unshift(o); LS.set(ordKey(), list);
  S.cart = []; saveCart(); S.lastOrder = o; S.stack = []; S.view = 'done'; render(); wa(orderMsg(o));
}
function markDelivered(id) {
  const list = orders(), o = list.find(x => x.id === id);
  if (o && confirm('यह ऑर्डर डिलीवर हो गया है?')) { o.status = 'Delivered'; LS.set(ordKey(), list); render(); }
}
function reorder(id) {
  const o = orders().find(x => x.id === id); if (!o) return;
  o.items.forEach(it => { if (prod(it.id)) addCart(it.id, it.qty); });
  S.stack = ['home']; S.view = 'cart'; render();
}

/* ===================== नेविगेशन ===================== */
function openProd(id) { S.pid = id; S.qty = prod(id).minQty; go('product'); }
function openCat(c) { S.list = { cat: c, q: '', sort: 'def' }; S.stack = ['home']; S.view = 'list'; render(); }
function searchGo(q) { S.list = { cat: 'all', q: q, sort: 'def' }; S.stack = ['home']; S.view = 'list'; render(); }
function openOrder(id) { S.oid = id; go('order'); }
function setCat(c) { S.list.cat = c; render(); }
function pQty(d) { const p = prod(S.pid); S.qty = Math.max(p.minQty, S.qty + d); if (S.qty === p.minQty && d < 0) toast(`न्यूनतम ऑर्डर ${p.minQty} पीस`); render(); }

const topBar = t => `<div class="top"><button class="ib" onclick="back()">←</button><h2>${t}</h2>${cartBtn()}</div>`;

const callBar = () => `<div class="callbar"><div><b>कॉल करके भी ऑर्डर करें</b><small>रेट व ऑर्डर सहायता</small></div><div class="cb">${CONFIG.CALLS.map(n => `<a href="tel:${n}">📞 ${n}</a>`).join('')}</div></div>`;

function vSplash() { return `<div class="splash">${logo(110)}<h1>ALLINSON</h1><div class="pill">B2B WHOLESALE</div><p style="font-size:12px;color:var(--mu);font-weight:600;margin-top:8px">होम्योपैथिक • आयुर्वेदिक • जर्मन दवाइयाँ</p><div class="ld"><div></div></div></div>`; }

  if (S.authMode === 'forgot') return `<div class="auth">${head}<h3>पासवर्ड रीसेट</h3><p class="sub">रजिस्टर्ड मोबाइल और दुकान का नाम डालें</p>
    <div class="fi"><label>मोबाइल नंबर</label><input id="fm" type="tel" maxlength="10"></div>

  return `<div class="auth">${head}<h3>दुकानदार लॉगिन</h3><p class="sub">सिर्फ रजिस्टर्ड मेडिकल व हर्बल दुकानदारों के लिए</p>
    <div class="fi"><label>मोबाइल नंबर</label><input id="lm" type="tel" maxlength="10" placeholder="मोबाइल नंबर"></div>

function vHome() {
  const deals = [...PRODUCTS].sort((a, b) => discOf(b) - discOf(a)).slice(0, 6);
  return `<div class="top"><div class="brand">${logo(36)}<div><b>ALLINSON</b><small>Healthy Business | Healthier Tomorrow</small></div></div><span class="pill">B2B</span>${cartBtn()}</div>

  ${callBar()}${nav('home')}`;

function filtered() {
  const L = S.list, q = L.q.toLowerCase();
  let a = PRODUCTS.filter(p => (L.cat === 'all' || p.cat === L.cat) && (p.name + ' ' + p.cat + ' ' + CATS[p.cat].label).toLowerCase().includes(q));
  if (L.sort === 'pl') a.sort((x, y) => rate(x) - rate(y));
  else if (L.sort === 'ph') a.sort((x, y) => rate(y) - rate(x));
  else if (L.sort === 'dh') a.sort((x, y) => discOf(y) - discOf(x));
  else if (L.sort === 'az') a.sort((x, y) => x.name.localeCompare(y.name));
  return a;
}
function prow(p) {
  return `<div class="prow" onclick="openProd(${p.id})"><div class="pimg c-${p.cat}">${medIcon(p,54)}</div><div class="pinfo"><span class="badge b-${p.cat}">${CATS[p.cat].icon} ${CATS[p.cat].label}</span><div class="pn">${esc(p.name)}</div><div class="pm">न्यूनतम ${p.minQty} पीस</div><div class="pp"><span><b>${rs(rate(p))}</b>/पीस</span><s>MRP ${rs(p.mrp)}</s><i>${discOf(p)}%+ छूट</i></div></div><button class="abtn" onclick="event.stopPropagation();addCart(${p.id})">+ जोड़ें</button></div>`;
}
function listItems() {
  const a = filtered(), box = document.getElementById('litems'); if (!box) return;
  document.getElementById('lc').textContent = a.length + ' दवाइयाँ';
  box.innerHTML = a.length ? a.map(prow).join('') : `<div class="empty"><i>🔎</i>कोई दवा नहीं मिली।<br>नीचे डिमांड भेजें:<div class="demand" style="margin:14px 0 0"><div class="dr"><input id="dem2" value="${esc(S.list.q)}" placeholder="दवा व कंपनी का नाम..."><button onclick="submitDemand('dem2')">भेजें</button></div></div></div>`;
}
function vList() {
  const L = S.list, title = L.cat === 'all' ? 'सभी दवाइयाँ' : CATS[L.cat].label + ' दवाइयाँ';
  return `${topBar(title)}<div class="pad"><div class="sbox"><span>🔍</span><input id="lq" value="${esc(L.q)}" placeholder="दवा या कैटेगरी से सर्च करें..." oninput="S.list.q=this.value;listItems()"></div></div>
  <div class="chips"><button class="chip ${L.cat === 'all' ? 'on' : ''}" onclick="setCat('all')">सभी</button>${Object.keys(CATS).map(k => `<button class="chip ${L.cat === k ? 'on' : ''}" onclick="setCat('${k}')">${CATS[k].icon} ${CATS[k].label}</button>`).join('')}</div>
  <div class="pad"><div class="row"><select onchange="S.list.sort=this.value;listItems()">${[['def', 'सॉर्ट: डिफ़ॉल्ट'], ['pl', 'रेट: कम से ज़्यादा'], ['ph', 'रेट: ज़्यादा से कम'], ['dh', 'सबसे ज़्यादा छूट'], ['az', 'नाम: A-Z']].map(([v, l]) => `<option value="${v}" ${L.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select><span id="lc"></span></div><div id="litems"></div></div>${nav('cats')}`;
}

function vProduct() {
  const p = prod(S.pid), r = rate(p);
  return `${topBar('दवा की जानकारी')}<div class="hero"><div class="pimg c-${p.cat}">${medIcon(p,104)}</div></div>
  <div class="card" style="margin-top:12px"><span class="badge b-${p.cat}">${CATS[p.cat].icon} ${CATS[p.cat].label}</span><h3 style="font-size:18px;font-weight:800;line-height:1.3">${esc(p.name)}</h3>
  <div style="margin:12px 0 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span style="font-size:26px;font-weight:800;color:var(--g2)">${rs(r)}</span><span style="color:var(--mu)">/पीस</span><s style="color:var(--mu);font-size:13px">MRP ${rs(p.mrp)}</s><span class="pill" style="font-size:11px">${discOf(p)}%+ छूट</span></div>
  <p style="font-size:12px;color:var(--mu);line-height:1.5">होलसेल रेट (रजिस्टर्ड दुकानदारों के लिए) • न्यूनतम ऑर्डर ${p.minQty} पीस<br>इस कैटेगरी में ${CATS[p.cat].min}% से ${CATS[p.cat].max}% तक छूट मिलती है, फाइनल रेट WhatsApp पर कन्फर्म होगा।</p></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="qty"><button onclick="pQty(-1)">−</button><span>${S.qty}</span><button onclick="pQty(1)">+</button></div><div style="text-align:right"><small style="color:var(--mu);font-size:11px">कुल (अनुमानित)</small><div style="font-size:20px;font-weight:800;color:var(--g)">${rs(r * S.qty)}</div></div></div></div>
  <div class="pad gap"><button class="btn" onclick="addCart(${p.id},S.qty)">🛒 कार्ट में जोड़ें</button><button class="btn out" onclick="buyNow()">अभी खरीदें</button></div>`;
}

function vCart() {
  if (!S.cart.length) return `${topBar('मेरी कार्ट')}<div class="empty"><i>🛒</i>आपकी कार्ट खाली है।<br><br><button class="btn" style="max-width:220px" onclick="openCat('all')">दवाइयाँ देखें</button></div>${nav('home')}`;
  const t = totals(S.cart);
  const rows = S.cart.map(c => { const p = prod(c.id); return `<div class="crow"><div class="pimg c-${p.cat}">${medIcon(p,40)}</div><div class="pinfo"><div class="pn">${esc(p.name)}</div><div class="pm">${rs(rate(p))}/पीस • MRP ${rs(p.mrp)}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px"><div class="qty"><button onclick="cartQty(${p.id},-1)">−</button><span>${c.qty}</span><button onclick="cartQty(${p.id},1)">+</button></div><b style="color:var(--g)">${rs(rate(p) * c.qty)}</b></div></div><button class="del" onclick="cartDel(${p.id})">🗑️</button></div>`; }).join('');
  return `<div class="top"><button class="ib" onclick="back()">←</button><h2>मेरी कार्ट</h2><button onclick="clearCart()" style="background:none;color:var(--red);font-size:12px">कार्ट खाली करें</button></div><div style="height:12px"></div>${rows}
  <div class="note">💡 रेट अनुमानित हैं (कैटेगरी की न्यूनतम छूट के हिसाब से)। फाइनल बिल और डिस्काउंट WhatsApp पर कन्फर्म होगा।</div>
  <div class="card"><div class="line"><span>कुल पीस</span><b>${t.count}</b></div><div class="line"><span>MRP कुल</span><b>${rs(t.mrp)}</b></div><div class="line sv"><span>आपकी बचत</span><b>− ${rs(t.save)}</b></div><div class="line"><span>डिलीवरी चार्ज</span><b>फाइनल बिल में</b></div><div class="line t"><span>अनुमानित कुल</span><b>${rs(t.sub)}</b></div></div>
  <div class="pad"><button class="btn" onclick="startCheckout()">चेकआउट पर जाएँ →</button></div>`;
}

function vCheckout() {
  const c = S.co, ad = S.user.addresses, t = totals(S.cart);
  const steps = `<div class="steps">${['पता', 'पेमेंट', 'कन्फर्म'].map((l, i) => `<div class="stp ${c.step >= i + 1 ? 'on' : ''}"><i>${i + 1}</i>${l}</div>${i < 2 ? '<div class="stl"></div>' : ''}`).join('')}</div>`;
  let body = '';
  if (c.step === 1) {
    body = `<div class="card"><h4>डिलीवरी पता चुनें</h4>${ad.map((a, i) => `<div class="opt ${c.addr === i ? 'on' : ''}" onclick="coAddr(${i})"><div class="rd"></div><div><b>${esc(S.user.shop)}</b><small>${esc(a.line)}<br>पिनकोड: ${esc(a.pin)}</small></div></div>`).join('')}
      ${c.adding ? `<div class="fi"><label>नया पता</label><textarea id="na" rows="2" placeholder="दुकान/घर का पता, शहर"></textarea></div><div class="fi"><label>पिनकोड</label><input id="np" type="tel" maxlength="6"></div><div style="display:flex;gap:8px"><button class="btn sm" onclick="saveAddr('co')">सेव करें</button><button class="btn sm out" onclick="S.co.adding=false;render()">रद्द करें</button></div>` : `<button class="lnk" onclick="S.co.adding=true;render()">+ नया पता जोड़ें</button>`}</div>
      <div class="card"><h4>डिलीवरी निर्देश (वैकल्पिक)</h4><div class="fi" style="margin:0"><textarea id="cnote" rows="2" placeholder="जैसे: फोन नंबर, लैंडमार्क, डिलीवरी का समय...">${esc(c.note)}</textarea></div></div>
      <div class="pad"><button class="btn" onclick="coStep(2)">आगे बढ़ें: पेमेंट →</button></div>`;
  } else if (c.step === 2) {
    body = `<div class="card"><h4>पेमेंट मोड चुनें</h4>
      <div class="opt ${c.pay === 'COD' ? 'on' : ''}" onclick="coPay('COD')"><div class="rd"></div><div><b>💵 Cash on Delivery (COD)</b><small>माल मिलने पर भुगतान करें</small></div></div>
      <div class="opt ${c.pay === 'UPI' ? 'on' : ''}" onclick="coPay('UPI')"><div class="rd"></div><div><b>💳 Online / UPI / Bank Transfer</b><small>ऑर्डर कन्फर्म होने पर पेमेंट डिटेल WhatsApp पर मिलेगी</small></div></div></div>
      <div class="pad gap"><button class="btn" onclick="coStep(3)">आगे बढ़ें: कन्फर्म →</button><button class="btn out" onclick="coStep(1)">← पीछे</button></div>`;
  } else {
    const a = ad[c.addr];
    body = `<div class="card"><h4>ऑर्डर की जानकारी</h4>${S.cart.map(i => { const p = prod(i.id); return `<div class="line"><span>${esc(p.name)} × ${i.qty}</span><b>${rs(rate(p) * i.qty)}</b></div>`; }).join('')}<div class="line t"><span>अनुमानित कुल</span><b>${rs(t.sub)}</b></div><div class="line sv"><span>आपकी बचत</span><b>${rs(t.save)}</b></div></div>
      <div class="card"><h4>पता</h4><div style="font-size:12.5px;line-height:1.5">${esc(S.user.shop)} • ${esc(S.user.mobile)}<br>${esc(a.line)}, ${esc(a.pin)}</div>${c.note ? `<div style="font-size:12px;color:var(--mu);margin-top:6px">निर्देश: ${esc(c.note)}</div>` : ''}</div>
      <div class="card"><h4>पेमेंट</h4><div style="font-size:13px;font-weight:600">${c.pay === 'COD' ? '💵 Cash on Delivery (COD)' : '💳 Online / UPI / Bank Transfer'}</div></div>
      <div class="note">ऑर्डर आपकी हिस्ट्री में सेव होगा और WhatsApp पर हमें भेजा जाएगा। फाइनल बिल व डिलीवरी समय हम वहीं बताएँगे।</div>
      <div class="pad gap"><button class="btn wa" onclick="placeOrder()">WhatsApp पर ऑर्डर भेजें</button><button class="btn out" onclick="coStep(2)">← पीछे</button></div>`;
  }
  return `${topBar('चेकआउट')}${steps}${body}`;
}

function vDone() {
  const o = S.lastOrder;
  return `<div class="ok"><div class="tick">✓</div><h2>ऑर्डर तैयार है!</h2><p>ऑर्डर नं <b>${esc(o.id)}</b><br>WhatsApp खुल गया होगा, वहाँ "Send" दबाकर ऑर्डर भेज दें।<br>अगर WhatsApp नहीं खुला तो नीचे का बटन दबाएँ।</p>
  <div class="gap"><button class="btn wa" onclick="wa(orderMsg(S.lastOrder))">WhatsApp फिर से खोलें</button><button class="btn" onclick="tab('orders')">मेरे ऑर्डर देखें</button><button class="btn out" onclick="tab('home')">होम पर जाएँ</button></div></div>`;
}

const stLbl = s => s === 'Delivered' ? 'डिलीवर्ड' : 'प्रोसेसिंग';
const fmtD = iso => new Date(iso).toLocaleDateString('hi-IN', { day: 'numeric', month: 'short', year: 'numeric' });
function vOrders() {
  const f = S.ordFilter, all = orders(), a = all.filter(o => f === 'all' || o.status === f);
  const tabs = [['all', 'सभी'], ['Processing', 'प्रोसेसिंग'], ['Delivered', 'डिलीवर्ड']];
  return `<div class="top"><h2>मेरे ऑर्डर</h2>${cartBtn()}</div><div class="chips" style="padding-top:12px">${tabs.map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" onclick="S.ordFilter='${k}';render()">${l}</button>`).join('')}</div><div style="height:6px"></div>
  ${a.length ? a.map(o => `<div class="ocard"><div class="oh"><b>#${esc(o.id)}</b><span class="st ${o.status}">${stLbl(o.status)}</span></div><small>${fmtD(o.date)}</small><div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0"><span style="font-size:12.5px">${o.items.length} दवाइयाँ</span><b style="color:var(--g)">${rs(o.sub)}</b></div><button class="btn sm" onclick="openOrder('${o.id}')">विवरण देखें</button></div>`).join('') : `<div class="empty"><i>📦</i>${all.length ? 'इस श्रेणी में कोई ऑर्डर नहीं।' : 'अभी तक कोई ऑर्डर नहीं।'}</div>`}${nav('orders')}`;
}
function vOrder() {
  const o = orders().find(x => x.id === S.oid); if (!o) return `${topBar('ऑर्डर')}<div class="empty">ऑर्डर नहीं मिला</div>`;
  return `${topBar('ऑर्डर #' + esc(o.id))}<div style="height:12px"></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><small style="color:var(--mu)">${fmtD(o.date)}</small><span class="st ${o.status}">${stLbl(o.status)}</span></div>
  ${o.items.map(i => `<div class="line"><span>${esc(i.name)} × ${i.qty}</span><b>${rs(i.rate * i.qty)}</b></div>`).join('')}<div class="line sv"><span>बचत</span><b>${rs(o.save)}</b></div><div class="line t"><span>अनुमानित कुल</span><b>${rs(o.sub)}</b></div></div>
  <div class="card"><h4>पता व पेमेंट</h4><div style="font-size:12.5px;line-height:1.6">${esc(o.addr.line)}, ${esc(o.addr.pin)}<br>${esc(o.pay)}${o.note ? '<br>निर्देश: ' + esc(o.note) : ''}</div></div>
  <div class="pad gap"><button class="btn wa" onclick="wa(orderMsg(orders().find(x=>x.id==='${o.id}')))">WhatsApp पर दोबारा भेजें</button><button class="btn" onclick="reorder('${o.id}')">🔁 फिर से यही ऑर्डर करें</button>${o.status !== 'Delivered' ? `<button class="btn out" onclick="markDelivered('${o.id}')">✔ डिलीवर्ड मार्क करें</button>` : ''}</div>`;
}

function vAccount() {
  const u = S.user;
  return `<div class="top"><h2>मेरा अकाउंट</h2>${cartBtn()}</div>
  <div class="ucard"><div class="av">${esc(u.name.charAt(0).toUpperCase())}</div><div><b>${esc(u.shop)}</b><small>${esc(u.name)} • ${esc(u.mobile)}</small></div></div>
  <div class="card"><h4>मेरे पते</h4>${u.addresses.map((a, i) => `<div class="addr"><div>${esc(a.line)}<br><small style="color:var(--mu)">पिनकोड: ${esc(a.pin)}</small></div><button class="del" onclick="delAddr(${i})">🗑️</button></div>`).join('')}
  ${S.addAddr ? `<div class="fi" style="margin-top:10px"><label>नया पता</label><textarea id="na" rows="2"></textarea></div><div class="fi"><label>पिनकोड</label><input id="np" type="tel" maxlength="6"></div><div style="display:flex;gap:8px"><button class="btn sm" onclick="saveAddr('ac')">सेव करें</button><button class="btn sm out" onclick="S.addAddr=false;render()">रद्द करें</button></div>` : `<button class="lnk" onclick="S.addAddr=true;render()">+ नया पता जोड़ें</button>`}</div>
  <div class="card"><h4>सहायता</h4><div class="gap">${CONFIG.CALLS.map(n => `<a href="tel:${n}" style="text-decoration:none"><button class="btn out sm" style="pointer-events:none">📞 ${n}</button></a>`).join('')}<button class="btn wa sm" onclick="wa('नमस्ते ALLINSON, मुझे सहायता चाहिए।')">💬 WhatsApp पर बात करें</button></div></div>
  <div class="pad"><button class="btn out" style="color:var(--red);border-color:var(--red)" onclick="logout()">लॉगआउट</button></div>${nav('account')}`;
}

/* ===================== रेंडर ===================== */
function render() {
  const v = S.view; let h;
  if (!S.user && v !== 'splash') { S.view = 'auth'; h = vAuth(); }
  else if (v === 'splash') h = vSplash();
  else if (v === 'auth') h = vAuth();
  else if (v === 'home') h = vHome();
  else if (v === 'list' || v === 'cats') { S.view = 'list'; h = vList(); }
  else if (v === 'product') h = vProduct();
  else if (v === 'cart') h = vCart();
  else if (v === 'checkout') h = vCheckout();
  else if (v === 'done') h = vDone();
  else if (v === 'orders') h = vOrders();
  else if (v === 'order') h = vOrder();
  else if (v === 'account') h = vAccount();
  else h = vHome();
  $('#app').innerHTML = h;
  if (S.view === 'list') listItems();
  if (S.view === 'splash') $('#app').style.paddingBottom = '0'; else $('#app').style.paddingBottom = '';
  updBadges(); window.scrollTo(0, 0);
}

(function boot() {
  const m = LS.get('aln_session', null), u = m && users()[m];
  if (u) { S.user = u; S.cart = LS.get('aln_cart_' + m, []); }
  render();
  setTimeout(() => { S.view = S.user ? 'home' : 'auth'; render(); }, 1200);
})();
</script>
</body>
</html>
