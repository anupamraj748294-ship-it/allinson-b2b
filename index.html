<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ALLINSON B2B - Wholesale Medicine Portal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FFE082'/%3E%3Cstop offset='100%25' stop-color='%23AA7C11'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='%23052619'/%3E%3Ccircle cx='256' cy='256' r='145' stroke='url(%23g)' stroke-width='16' fill='none'/%3E%3Cpath d='M256 150 L325 330 L288 330 L256 242 L224 330 L187 330 Z' fill='url(%23g)'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #071e14;
      --card-bg: #0d2c1f;
      --card-border: #1a4a35;
      --gold: #f4c430;
      --gold-gradient: linear-gradient(135deg, #ffe082 0%, #d4af37 50%, #aa7c11 100%);
      --emerald-light: #22c55e;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: var(--text-main);
      padding-bottom: 90px;
    }
    header {
      background: rgba(7, 30, 20, 0.96);
      backdrop-filter: blur(12px);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .b2b-badge {
      background: #14532d;
      color: #86efac;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      border: 1px solid #22c55e;
    }
    .banner {
      background: linear-gradient(180deg, rgba(20, 83, 45, 0.5) 0%, rgba(7, 30, 20, 0.1) 100%);
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--card-border);
    }
    .banner h1 {
      font-size: 20px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .banner p {
      font-size: 13px;
      color: #cbd5e1;
    }
    .search-box {
      padding: 16px 20px 8px;
    }
    .search-box input {
      width: 100%;
      background: #0d2c1f;
      border: 1.5px solid var(--card-border);
      color: #fff;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--gold);
    }
    .category-tabs {
      display: flex;
      gap: 10px;
      padding: 10px 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      background: #0d2c1f;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--gold);
      color: #052619;
      border-color: var(--gold);
    }
    .medicine-list {
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .med-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .med-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .med-name {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }
    .med-type {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .type-homeo { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .type-ayur { background: #713f12; color: #fde047; border: 1px solid #ca8a04; }
    .type-german { background: #1e3a5f; color: #93c5fd; border: 1px solid #3b82f6; }
    
    .pricing-row {
      background: rgba(0, 0, 0, 0.25);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mrp-label {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .mrp-val {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }
    .discount-badge {
      background: linear-gradient(135deg, #15803d, #166534);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      display: inline-block;
      margin-bottom: 14px;
      border-left: 4px solid var(--gold);
    }
    .card-actions {
      display: flex;
      gap: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-call {
      background: var(--gold-gradient);
      color: #052619;
    }
    .btn-wa {
      background: #25d366;
      color: #ffffff;
    }
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(7, 30, 20, 0.98);
      border-top: 1.5px solid var(--card-border);
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">ALLINSON</div>
    <div class="b2b-badge">B2B WHOLESALE</div>
  </header>

  <div class="banner">
    <h1>होलसेल रेट एवं ऑर्डर सहायता</h1>
    <p>एमआरपी पर विशेष छूट प्राप्त करने हेतु नीचे सीधे संपर्क करें</p>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="दवा का नाम सर्च करें..." onkeyup="filterMeds()">
  </div>

  <div class="category-tabs">
    <button class="tab-btn active" onclick="setFilter('all', this)">सभी दवाइयाँ</button>
    <button class="tab-btn" onclick="setFilter('Homeopathic', this)">होम्योपैथिक</button>
    <button class="tab-btn" onclick="setFilter('Ayurvedic', this)">आयुर्वेदिक</button>
    <button class="tab-btn" onclick="setFilter('German', this)">जर्मन</button>
  </div>

  <div class="medicine-list" id="medicineList">
    <!-- दवाइयाँ JavaScript द्वारा लोड होंगी -->
  </div>

  <div class="bottom-bar">
    <a href="tel:7482948349" class="action-btn btn-call">📞 Call 1: 7482948349</a>
    <a href="tel:6207222800" class="action-btn btn-call">📞 Call 2: 6207222800</a>
  </div>

  <script>
    // आपकी दवाइयों का डेटा (Sheet या Local List)
    const medicines = [
      { name: "Arnica Montana 30 / 200", category: "Homeopathic", mrp: 120 },
      { name: "Berberis Aquifolium Q", category: "Homeopathic", mrp: 180 },
      { name: "Dr. Reckeweg R1 to R89", category: "German", mrp: 290 },
      { name: "Schwabe Cineraria Maritima", category: "German", mrp: 175 },
      { name: "Ashwagandha Churna 100g", category: "Ayurvedic", mrp: 150 },
      { name: "Chyawanprash Special 1kg", category: "Ayurvedic", mrp: 450 },
      { name: "Adel 48 (Itires Drop)", category: "German", mrp: 310 },
      { name: "Liv-52 Syrup / Tablets", category: "Ayurvedic", mrp: 160 }
    ];

    let currentCategory = 'all';

    function getDiscountText(cat) {
      if (cat === "Homeopathic") return "50% से 75% होलसेल छूट";
      if (cat === "Ayurvedic") return "25% से 75% होलसेल छूट";
      if (cat === "German") return "30% से 40% होलसेल छूट";
      return "विशेष होलसेल छूट उपलब्ध";
    }

    function getTypeClass(cat) {
      if (cat === "Homeopathic") return "type-homeo";
      if (cat === "Ayurvedic") return "type-ayur";
      if (cat === "German") return "type-german";
      return "type-homeo";
    }

    function renderMeds() {
      const container = document.getElementById('medicineList');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      const filtered = medicines.filter(m => {
        const matchesCat = currentCategory === 'all' || m.category === currentCategory;
        const matchesSearch = m.name.toLowerCase().includes(searchQuery);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: #94a3b8; font-size: 16px;">कोई दवा नहीं मिली। सीधे कॉल पर रेट जानें।</div>`;
        return;
      }

      filtered.forEach(med => {
        const disc = getDiscountText(med.category);
        const typeClass = getTypeClass(med.category);
        const waMsg = encodeURIComponent(`नमस्ते ALLINSON, मुझे "${med.name}" (MRP: ₹${med.mrp}) का होलसेल रेट जानना है और ऑर्डर देना है।`);

        const card = document.createElement('div');
        card.className = 'med-card';
        card.innerHTML = `
          <div class="med-header">
            <div class="med-name">${med.name}</div>
            <span class="med-type ${typeClass}">${med.category}</span>
          </div>

          <div class="pricing-row">
            <span class="mrp-label">मूल्य (MRP):</span>
            <span class="mrp-val">₹${med.mrp}</span>
          </div>

          <div class="discount-badge">🏷️ ${disc}</div>

          <div class="card-actions">
            <a href="tel:7482948349" class="action-btn btn-call">📞 कॉल रेट</a>
            <a href="https://wa.me/917482948349?text=${waMsg}" class="action-btn btn-wa">💬 WhatsApp</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterMeds() {
      renderMeds();
    }

    function setFilter(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMeds();
    }

    renderMeds();
  </script>
</body>
</html>
